<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Le Dinh Tri Tue</title>
  <meta name="description" content="Page not found on Le Dinh Tri Tue's academic homepage.">
  <meta name="theme-color" content="#0f5b66">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --canvas: #eef4f1;
      --paper: #fffdf9;
      --ink: #14292c;
      --muted: #697b7c;
      --line: #d8e3df;
      --accent: #0f5b66;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(15, 91, 102, 0.12), transparent 28rem),
        var(--canvas);
      font-family: var(--sans);
    }

    main {
      width: min(38rem, 100%);
      padding: clamp(2rem, 7vw, 4.5rem);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      box-shadow: 0 24px 70px rgba(26, 61, 64, 0.10);
    }

    .code {
      margin: 0 0 0.6rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.8rem, 10vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 0.95;
    }

    p {
      margin: 1.2rem 0 1.6rem;
      color: var(--muted);
      line-height: 1.65;
    }

    a {
      display: inline-block;
      padding: 0.62rem 0.95rem;
      color: white;
      background: var(--accent);
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 750;
      text-decoration: none;
    }

    a:hover { background: #073f47; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 error</p>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the address may be incorrect.</p>
    <a href="./">Return to the homepage</a>
  </main>
</body>
</html>
